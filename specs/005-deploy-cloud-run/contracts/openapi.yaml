openapi: 3.1.0
info:
  title: Golden Raspberry Awards API
  version: 1.2.1
  description: >
    Intervalos entre prêmios consecutivos de produtores na categoria Pior Filme e listagem dos filmes
    indicados e vencedores. Os dados vêm do arquivo CSV carregado na inicialização.
paths:
  /api/producers/intervals:
    get:
      operationId: getProducerIntervals
      summary: Produtores com o menor e o maior intervalo entre duas vitórias consecutivas
      description: >
        Considera só filmes vencedores e pares de vitórias vizinhas de cada produtor. Todos os empatados
        entram na lista, ordenados por previousWin e depois por nome. Sem produtor com duas vitórias,
        as duas listas vêm vazias.
      tags: [producers]
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Intervalos mínimo e máximo
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProducerIntervals'
              examples:
                arquivoFornecido:
                  summary: Resultado com o arquivo fornecido no enunciado
                  value:
                    min:
                      - { producer: Joel Silver, interval: 1, previousWin: 1990, followingWin: 1991 }
                    max:
                      - { producer: Matthew Vaughn, interval: 13, previousWin: 2002, followingWin: 2015 }
                semDadosSuficientes:
                  summary: Nenhum produtor com duas vitórias
                  value: { min: [], max: [] }
        '304':
          $ref: '#/components/responses/NotModified'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/movies:
    get:
      operationId: listMovies
      summary: Lista paginada de filmes, com filtros opcionais
      description: Ordenada por ano e depois por título.
      tags: [movies]
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: year
          in: query
          required: false
          description: Ano exato (só dígitos)
          schema: { type: integer, minimum: 0 }
        - name: winner
          in: query
          required: false
          description: true para só vencedores, false para só não vencedores
          schema: { type: boolean }
        - name: page
          in: query
          required: false
          description: Página, começando em 0
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          required: false
          description: Itens por página
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Página de filmes
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoviePage'
              example:
                content:
                  - year: 1980
                    title: Can't Stop the Music
                    studios: Associated Film Distribution
                    producers: Allan Carr
                    winner: true
                page: 0
                size: 20
                totalElements: 206
                totalPages: 11
        '304':
          $ref: '#/components/responses/NotModified'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          description: Parâmetro inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: Bad Request
                status: 400
                detail: Parâmetro inválido na consulta
                instance: /api/movies
                invalidParams:
                  - { name: winner, reason: deve ser true ou false }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opcional. Exigido só quando a variável API_TOKEN está definida.
  parameters:
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: >
        ETag recebido numa resposta anterior. Aceita um valor, uma lista separada por vírgulas, a forma
        fraca (W/"...") ou *. Quando contém o ETag atual, a resposta é 304 sem corpo.
      schema: { type: string }
      example: '"0a1b2c3d4e5f60718293a4b5c6d7e8f90"'
  headers:
    WWW-Authenticate:
      description: Esquema exigido, presente só no 401.
      schema: { type: string }
      example: 'Bearer realm="awards"'
    ETag:
      description: >
        Identifica a representação. É derivado do conteúdo do corpo: o mesmo corpo tem sempre o mesmo
        ETag, inclusive entre execuções com o mesmo arquivo.
      required: true
      schema: { type: string }
      example: '"0a1b2c3d4e5f60718293a4b5c6d7e8f90"'
  responses:
    Unauthorized:
      description: Autenticação ligada e token ausente ou inválido
      headers:
        WWW-Authenticate:
          $ref: '#/components/headers/WWW-Authenticate'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: about:blank
            title: Unauthorized
            status: 401
            detail: Token ausente ou inválido
            instance: /api/producers/intervals
    NotModified:
      description: A representação não mudou desde o ETag enviado em If-None-Match. Sem corpo.
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
  schemas:
    ProducerIntervals:
      type: object
      additionalProperties: false
      required: [min, max]
      properties:
        min:
          type: array
          items: { $ref: '#/components/schemas/ProducerInterval' }
        max:
          type: array
          items: { $ref: '#/components/schemas/ProducerInterval' }
    ProducerInterval:
      type: object
      additionalProperties: false
      required: [producer, interval, previousWin, followingWin]
      properties:
        producer: { type: string }
        interval: { type: integer, minimum: 0 }
        previousWin: { type: integer }
        followingWin: { type: integer }
    MoviePage:
      type: object
      additionalProperties: false
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/Movie' }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 100 }
        totalElements: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    Movie:
      type: object
      additionalProperties: false
      required: [year, title, studios, producers, winner]
      properties:
        year: { type: integer }
        title: { type: string }
        studios:
          type: [string, 'null']
          description: Texto como no arquivo; null quando a coluna está vazia
        producers:
          type: string
          description: Texto como no arquivo
        winner: { type: boolean }
    ProblemDetail:
      type: object
      description: RFC 9457
      required: [title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        invalidParams:
          type: array
          items:
            type: object
            required: [name, reason]
            properties:
              name: { type: string }
              reason: { type: string }
