# Pipeline de CI (spec 002, US6 e FR-028 a FR-029; research R9 a R14; contracts/ci-pipeline.md).
# Toda action é fixada por hash de commit (FR-028b). Nenhum segredo é usado, e nenhuma imagem é
# publicada. A política é verificada pelo job workflow-policy (.github/scripts/check-workflows.sh).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-policy:
    name: Política do workflow e do Dependabot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Hash de commit, permissões, segredos, publicação e Dependabot
        run: .github/scripts/check-workflows.sh

  build:
    name: Build, testes e cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: ./mvnw verify (duas execuções do Failsafe e cobertura mínima de 90%)
        run: ./mvnw -B verify
      - name: Cobertura no resumo
        if: always()
        run: |
          csv=target/site/jacoco-it/jacoco.csv
          if [[ -f "$csv" ]]; then
            awk -F, 'NR > 1 { m += $8; c += $9 } END { if (m + c > 0) printf "### Cobertura de linhas (testes de integração)\n\n%.2f%% (%d de %d linhas; mínimo 90%%)\n", 100 * c / (m + c), c, m + c }' "$csv" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Relatório de cobertura não gerado." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Relatórios de cobertura e de testes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relatorios-build
          path: |
            target/site/jacoco-it/
            target/failsafe-reports/
            target/failsafe-reports-json-logs/
          if-no-files-found: warn

  postgres:
    # Testes que dependem do PostgreSQL, no perfil Maven postgres-it (spec 003, FR-007; Princípio VI,
    # constituição 1.7.0; research R16). O banco é um service container com collation C (research R4).
    # Nenhuma credencial no workflow: o banco aceita a conexão por trust, e só existe neste runner.
    name: Testes com PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
        env:
          POSTGRES_DB: awards
          POSTGRES_USER: awards
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U awards -d awards"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: ./mvnw -Ppostgres-it verify
        env:
          DB_URL: jdbc:postgresql://localhost:5432/awards
          DB_USER: awards
          DB_PASSWORD: ''
        run: ./mvnw -B -Ppostgres-it verify
      - name: Relatórios dos testes com PostgreSQL
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relatorios-postgres
          path: target/failsafe-reports-postgres/
          if-no-files-found: warn

  codeql:
    name: Análise de segurança do código (CodeQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: java-kotlin
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          output: sarif-results
          # Num PR vindo de fork, o token não pode enviar ao code scanning; a porta abaixo roda mesmo
          # assim, sobre o SARIF local (research R9).
          upload: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) && 'never' || 'always' }}
      - name: Porta de severidade (alta e crítica reprovam)
        run: |
          shopt -s nullglob
          files=(sarif-results/*.sarif)
          (( ${#files[@]} > 0 )) || { echo "nenhum SARIF gerado"; exit 1; }
          jq -r '
            .runs[] as $run
            | ([$run.tool.driver.rules[]?, $run.tool.extensions[]?.rules[]?]
               | map({key: .id, value: ((.properties["security-severity"] // "0") | tonumber)})
               | from_entries) as $severity
            | $run.results[]?
            | [($severity[.ruleId] // 0), .ruleId,
               ((.locations[0].physicalLocation.artifactLocation.uri // "?") + ":"
                + ((.locations[0].physicalLocation.region.startLine // 0) | tostring))]
            | @tsv' "${files[@]}" > findings.tsv
          total=$(wc -l < findings.tsv)
          high=$(awk -F'\t' '$1 >= 7.0' findings.tsv | wc -l)
          {
            echo "### CodeQL"
            echo
            echo "Achados: $total; de severidade alta ou crítica (≥ 7,0): $high."
            if (( total > 0 )); then
              echo
              echo "| Severidade | Regra | Local |"
              echo "| --- | --- | --- |"
              awk -F'\t' '{ printf "| %s | %s | %s |\n", $1, $2, $3 }' findings.tsv
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          (( high == 0 ))

  dependencies:
    name: Vulnerabilidades das dependências (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Relatório completo (todas as severidades, sem reprovar)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: table
          output: trivy-dependencias.txt
          exit-code: '0'
      - name: Relatório no resumo
        if: always()
        run: |
          { echo "### Trivy: dependências"; echo; echo '```'; cat trivy-dependencias.txt 2>/dev/null || echo "sem relatório"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Porta (alta e crítica, só com versão corrigida)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'

  dockerfile-lint:
    name: Lint do Dockerfile (hadolint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  image:
    name: Imagem, vulnerabilidades da imagem e teste de fumaça
    needs: dockerfile-lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Contexto de build contra a lista de permissão do .dockerignore
        run: .github/scripts/check-docker-context.sh
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build da imagem (sem publicação)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: awards:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Teste de fumaça (13 passos; menos de 2 minutos até o resultado de referência)
        run: .github/scripts/smoke-test.sh awards:ci
      - name: Relatório da imagem (todas as severidades, sem reprovar)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: awards:ci
          scanners: vuln
          format: table
          output: trivy-imagem.txt
          exit-code: '0'
      - name: Relatório da imagem no resumo
        if: always()
        run: |
          { echo "### Trivy: imagem"; echo; echo '```'; cat trivy-imagem.txt 2>/dev/null || echo "sem relatório"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Porta da imagem (alta e crítica, só com versão corrigida)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: awards:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'
