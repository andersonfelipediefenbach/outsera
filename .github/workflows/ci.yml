# Pipeline de CI (spec 002, US6 e FR-028 a FR-029; research R9 a R14; contracts/ci-pipeline.md).
# Toda action é fixada por hash de commit (FR-028b). Nenhum segredo é usado. A única publicação é a do job
# deploy, só em push na main, com a imagem testada no job image e identidade federada sem chaves (spec 005;
# contracts/ci-deploy.md). A política é verificada pelo job workflow-policy (.github/scripts/check-workflows.sh).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Fora da main, uma execução nova cancela a anterior do mesmo ref. Na main, nada é cancelado, para não
# interromper uma publicação no meio (spec 005, FR-011; research R7).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  workflow-policy:
    name: Política do workflow, do Dependabot e do compose
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Histórico e tags: o check-unchanged-tests.sh compara com as tags v0.2.0 e v0.3.0 (spec 003,
          # research R14; spec 004, research R14).
          fetch-depth: 0
      - name: Hash de commit, permissões, segredos, publicação, Dependabot e imagens do compose por digest
        run: .github/scripts/check-workflows.sh
      - name: Nenhum byte NUL em arquivo de texto versionado
        run: .github/scripts/check-text-files.sh
      - name: Testes de integração dos Marcos 1 e 2 sem alteração desde a v0.2.0
        run: .github/scripts/check-unchanged-tests.sh v0.2.0
      # Spec 004, FR-001 e SC-001; research R14.
      - name: Testes de integração dos Marcos 1 a 3 sem alteração desde a v0.3.0
        run: .github/scripts/check-unchanged-tests.sh v0.3.0
      # Spec 006, FR-005: vale também para os ITs dos Marcos 4 e 5.
      - name: Testes de integração dos Marcos 1 a 5 sem alteração desde a v0.5.0
        run: .github/scripts/check-unchanged-tests.sh v0.5.0

  build:
    name: Build, testes e cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Perfil extras (constituição 2.0.0, Princípios II e VI): os ITs do enunciado (Marco 1), os dos extras
      # e a execução com o log em JSON, com a cobertura mínima sobre a soma das três execuções.
      - name: ./mvnw -Pextras verify (três execuções do Failsafe e cobertura mínima de 90%)
        run: ./mvnw -B -Pextras verify
      - name: Cobertura no resumo
        if: always()
        run: |
          csv=target/site/jacoco-it/jacoco.csv
          if [[ -f "$csv" ]]; then
            awk -F, 'NR > 1 { m += $8; c += $9 } END { if (m + c > 0) printf "### Cobertura de linhas (testes de integração)\n\n%.2f%% (%d de %d linhas; mínimo 90%%)\n", 100 * c / (m + c), c, m + c }' "$csv" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Relatório de cobertura não gerado." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Relatórios de cobertura e de testes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relatorios-build
          path: |
            target/site/jacoco-it/
            target/failsafe-reports/
            target/failsafe-reports-extras/
            target/failsafe-reports-json-logs/
          if-no-files-found: warn

  postgres:
    # Testes que dependem do PostgreSQL, no perfil Maven postgres-it (spec 003, FR-007; Princípio VI,
    # constituição 1.7.0; research R16). O banco é um service container com collation C (research R4).
    # Nenhuma credencial no workflow: o banco aceita a conexão por trust, e só existe neste runner.
    name: Testes com PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
        env:
          POSTGRES_DB: awards
          POSTGRES_USER: awards
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U awards -d awards"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: ./mvnw -Ppostgres-it verify
        env:
          DB_URL: jdbc:postgresql://localhost:5432/awards
          DB_USER: awards
          DB_PASSWORD: ''
        run: ./mvnw -B -Ppostgres-it verify
      - name: Relatórios dos testes com PostgreSQL
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relatorios-postgres
          path: target/failsafe-reports-postgres/
          if-no-files-found: warn

  codeql:
    name: Análise de segurança do código (CodeQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: java-kotlin
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          output: sarif-results
          # Num PR vindo de fork, o token não pode enviar ao code scanning; a porta abaixo roda mesmo
          # assim, sobre o SARIF local (research R9).
          upload: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) && 'never' || 'always' }}
      - name: Porta de severidade (alta e crítica reprovam, salvo exceção registrada)
        run: |
          shopt -s nullglob
          .github/scripts/codeql-gate.sh sarif-results/*.sarif

  dependencies:
    # Inventário efetivo das dependências de runtime (spec 004, FR-032 e FR-033; research R12). O Trivy
    # analisa os JARs que o Maven copia, com as versões que o build resolve, e não o pom.xml. No pom.xml,
    # ele busca os POMs no Maven Central na hora da análise, e uma busca que falha (por exemplo, com 429)
    # tira as transitivas do inventário sem reprovar nada. O modo é rootfs porque o fs não analisa JARs.
    name: Vulnerabilidades das dependências (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Dependências de runtime copiadas pelo Maven (versões efetivas do build)
        run: ./mvnw -B -q dependency:copy-dependencies -DincludeScope=runtime -DoutputDirectory=target/runtime-deps
      - name: Relatório completo (todas as severidades, sem reprovar)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: rootfs
          scan-ref: target/runtime-deps
          scanners: vuln
          format: table
          output: trivy-dependencias.txt
          exit-code: '0'
      - name: Relatório no resumo
        if: always()
        run: |
          { echo "### Trivy: dependências"; echo; echo '```'; cat trivy-dependencias.txt 2>/dev/null || echo "sem relatório"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Porta (alta e crítica, só com versão corrigida)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: rootfs
          scan-ref: target/runtime-deps
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'
      - name: Inventário completo (todos os pacotes, sem reprovar)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: rootfs
          scan-ref: target/runtime-deps
          scanners: vuln
          format: json
          list-all-pkgs: true
          output: trivy-inventario.json
          exit-code: '0'
      - name: lz4-java e snappy-java no inventário (FR-033)
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### Inventário efetivo: transitivas do kafka-clients"
            echo
            echo "| Pacote | Versão |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          missing=0
          for pkg in at.yawk.lz4:lz4-java org.xerial.snappy:snappy-java; do
            versions="$(jq -r --arg p "$pkg" '[.Results[]?.Packages[]? | select(.Name == $p) | .Version] | unique | join(", ")' trivy-inventario.json)"
            if [[ -z "$versions" ]]; then
              echo "| $pkg | **ausente** |" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::$pkg não está no inventário do Trivy"
              missing=1
            else
              echo "| $pkg | $versions |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          exit "$missing"

  frontend:
    # Front-end (spec 006, FR-019 e FR-022; contracts/ci-frontend.md, "Job frontend"): lint, testes unitários com
    # cobertura mínima de 80% das linhas, build de produção e auditoria das dependências de execução. Só Node, sem
    # Maven: o ./mvnw não depende do front (constituição 2.1.0, Princípio II).
    name: Front-end (lint, unitários, build e auditoria)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dependências (npm ci, com o lockfile)
        run: npm ci --no-audit --no-fund
      - name: Lint (angular-eslint, inclusive a proibição de respostas simuladas no ponta a ponta)
        run: npm run lint
      - name: Testes unitários com cobertura mínima de 80% das linhas
        run: npm test -- --watch=false --coverage
      - name: Cobertura no resumo
        if: always()
        run: |
          summary=coverage/frontend/coverage-summary.json
          if [[ -f "$summary" ]]; then
            node -e 'const t=require("./'"$summary"'").total; console.log("### Cobertura do front (testes unitários)\n\nlinhas: " + t.lines.pct + "% (" + t.lines.covered + " de " + t.lines.total + "; mínimo 80%)")' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Relatório de cobertura do front não gerado." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build de produção (com os orçamentos de tamanho)
        run: npm run build
      - name: Auditoria completa no resumo (sem reprovar)
        if: always()
        run: |
          { echo "### npm audit (todas as dependências)"; echo; echo '```'; npm audit || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Porta da auditoria (alta e crítica, só dependências de execução)
        run: npm audit --omit=dev --audit-level=high

  dockerfile-lint:
    name: Lint do Dockerfile (hadolint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
      # Imagem do front (spec 006, FR-025).
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: frontend/Dockerfile
          failure-threshold: warning

  image:
    name: Imagem, vulnerabilidades da imagem e teste de fumaça
    needs: dockerfile-lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      # Digest do manifesto da imagem testada, que o job deploy publica sem rebuild (spec 005, FR-002).
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Contexto de build contra a lista de permissão do .dockerignore
        run: .github/scripts/check-docker-context.sh
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Um único build com duas saídas: a awards:ci no Docker (teste de fumaça e Trivy) e o mesmo resultado em
      # layout OCI, que segue como artefato para o job deploy. Sem atestados, o tar tem um único manifesto
      # linux/amd64 (spec 005, research R1). Nada é publicado aqui.
      - name: Build da imagem (sem publicação; Docker e tar OCI do mesmo build)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          provenance: false
          sbom: false
          outputs: |
            type=docker,name=awards:ci
            type=oci,dest=${{ runner.temp }}/awards-oci.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Digest do manifesto e identidade da imagem testada
        id: digest
        env:
          OCI_TAR: ${{ runner.temp }}/awards-oci.tar
        run: |
          set -euo pipefail
          layout="$RUNNER_TEMP/awards-oci"
          mkdir -p "$layout" && tar -xf "$OCI_TAR" -C "$layout"
          count="$(jq '.manifests | length' "$layout/index.json")"
          media="$(jq -r '.manifests[0].mediaType' "$layout/index.json")"
          if [[ "$count" != "1" || "$media" != "application/vnd.oci.image.manifest.v1+json" ]]; then
            echo "::error::o tar OCI deveria ter um único manifesto de imagem (encontrado: $count, $media)"
            exit 1
          fi
          digest="$(jq -r '.manifests[0].digest' "$layout/index.json")"
          config="$(jq -r '.config.digest' "$layout/blobs/sha256/${digest#sha256:}")"
          platform="$(jq -r '.architecture + "/" + .os' "$layout/blobs/sha256/${config#sha256:}")"
          if [[ "$platform" != "amd64/linux" ]]; then
            echo "::error::a imagem deveria ser linux/amd64 (encontrado: $platform)"
            exit 1
          fi
          # Armazenamento clássico do Docker: o Id é o digest da configuração; com o do containerd, o do manifesto.
          id="$(docker image inspect awards:ci --format '{{.Id}}')"
          if [[ "$id" != "$config" && "$id" != "$digest" ]]; then
            echo "::error::a awards:ci ($id) não é a imagem do tar OCI (configuração $config, manifesto $digest)"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          { echo "### Imagem testada"; echo; echo "- manifesto: \`$digest\`"; echo "- configuração: \`$config\`"; echo "- awards:ci: \`$id\`"; } >> "$GITHUB_STEP_SUMMARY"
      - name: Teste de fumaça (13 passos; menos de 2 minutos até o resultado de referência)
        run: .github/scripts/smoke-test.sh awards:ci
      - name: Imagem testada como artefato para o job deploy (só em push na main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: awards-oci
          path: ${{ runner.temp }}/awards-oci.tar
          retention-days: 1
          # As camadas já vêm comprimidas no tar OCI.
          compression-level: 0
          if-no-files-found: error
      - name: Relatório da imagem (todas as severidades, sem reprovar)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: awards:ci
          scanners: vuln
          format: table
          output: trivy-imagem.txt
          exit-code: '0'
      - name: Relatório da imagem no resumo
        if: always()
        run: |
          { echo "### Trivy: imagem"; echo; echo '```'; cat trivy-imagem.txt 2>/dev/null || echo "sem relatório"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Porta da imagem (alta e crítica, só com versão corrigida)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: awards:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'

  web:
    # Imagem do front (spec 006, FR-023, FR-025, FR-026 e FR-026a; contracts/ci-frontend.md, "Job web"): o mesmo
    # tratamento da imagem da API (um build com saída no Docker e em tar OCI, digest como saída, teste de fumaça e
    # porta de vulnerabilidades) e o ponta a ponta com o Playwright contra a API real (o JAR do modo padrão, com o
    # arquivo fornecido) e a imagem do front, sem respostas simuladas. Nada é publicado aqui.
    name: Imagem do front, fumaça e ponta a ponta
    needs: dockerfile-lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      # Digest do manifesto da imagem testada, que o job deploy-web publica sem rebuild.
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build da imagem do front (sem publicação; Docker e tar OCI do mesmo build)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          provenance: false
          sbom: false
          outputs: |
            type=docker,name=awards-web:ci
            type=oci,dest=${{ runner.temp }}/awards-web-oci.tar
          cache-from: type=gha,scope=awards-web
          cache-to: type=gha,mode=max,scope=awards-web
      - name: Digest do manifesto e identidade da imagem testada
        id: digest
        env:
          OCI_TAR: ${{ runner.temp }}/awards-web-oci.tar
        run: |
          set -euo pipefail
          layout="$RUNNER_TEMP/awards-web-oci"
          mkdir -p "$layout" && tar -xf "$OCI_TAR" -C "$layout"
          count="$(jq '.manifests | length' "$layout/index.json")"
          media="$(jq -r '.manifests[0].mediaType' "$layout/index.json")"
          if [[ "$count" != "1" || "$media" != "application/vnd.oci.image.manifest.v1+json" ]]; then
            echo "::error::o tar OCI deveria ter um único manifesto de imagem (encontrado: $count, $media)"
            exit 1
          fi
          digest="$(jq -r '.manifests[0].digest' "$layout/index.json")"
          config="$(jq -r '.config.digest' "$layout/blobs/sha256/${digest#sha256:}")"
          platform="$(jq -r '.architecture + "/" + .os' "$layout/blobs/sha256/${config#sha256:}")"
          if [[ "$platform" != "amd64/linux" ]]; then
            echo "::error::a imagem deveria ser linux/amd64 (encontrado: $platform)"
            exit 1
          fi
          id="$(docker image inspect awards-web:ci --format '{{.Id}}')"
          if [[ "$id" != "$config" && "$id" != "$digest" ]]; then
            echo "::error::a awards-web:ci ($id) não é a imagem do tar OCI (configuração $config, manifesto $digest)"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          { echo "### Imagem do front testada"; echo; echo "- manifesto: \`$digest\`"; echo "- configuração: \`$config\`"; echo "- awards-web:ci: \`$id\`"; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: API do modo padrão no ar (JAR, arquivo fornecido)
        run: |
          set -euo pipefail
          ./mvnw -B -q -DskipTests package
          nohup java -jar target/awards-*.jar > "$RUNNER_TEMP/api.log" 2>&1 &
          for _ in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8080/actuator/health/readiness >/dev/null; then echo "API pronta"; exit 0; fi
            sleep 1
          done
          echo "::error::a API não ficou pronta em 90 s"
          tail -n 50 "$RUNNER_TEMP/api.log"
          exit 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Teste de fumaça da imagem do front (10 passos)
        run: .github/scripts/web-smoke-test.sh awards-web:ci http://host.docker.internal:8080
      - name: Front no ar para o ponta a ponta (a imagem testada, com o repasse de /api)
        run: |
          set -euo pipefail
          docker run -d --name e2e-web -p 127.0.0.1:8081:8080 --add-host host.docker.internal:host-gateway \
            -e API_URL=http://host.docker.internal:8080 awards-web:ci
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8081/healthz >/dev/null; then exit 0; fi
            sleep 1
          done
          echo "::error::o front não respondeu /healthz em 30 s"
          docker logs e2e-web
          exit 1
      - name: Ponta a ponta (Playwright, desktop e celular)
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:8081
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Relatório do Playwright (na falha)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Relatório da imagem do front (todas as severidades, sem reprovar)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: awards-web:ci
          scanners: vuln
          format: table
          output: trivy-imagem-web.txt
          exit-code: '0'
      - name: Relatório da imagem do front no resumo
        if: always()
        run: |
          { echo "### Trivy: imagem do front"; echo; echo '```'; cat trivy-imagem-web.txt 2>/dev/null || echo "sem relatório"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Porta da imagem do front (alta e crítica, só com versão corrigida)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: awards-web:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'
      - name: Imagem do front testada como artefato para o job deploy-web (só em push na main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: awards-web-oci
          path: ${{ runner.temp }}/awards-web-oci.tar
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  alert-rules:
    # Regras de alerta do SLO (spec 004, FR-004, FR-006 e FR-008; research R3), com o promtool da mesma
    # imagem do Prometheus do compose: o mesmo digest e a versão que o Dependabot atualiza.
    name: Regras de alerta do SLO (promtool)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: promtool check rules
        run: docker compose run --rm --no-deps --entrypoint promtool prometheus check rules /etc/prometheus/rules/slo.yml
      # O check config exige que o credentials_file exista. Ele é criado pelo entrypoint do serviço, que o
      # --entrypoint substitui; aqui ele fica vazio, como na subida sem token.
      - name: promtool check config
        run: |
          docker compose run --rm --no-deps --entrypoint sh prometheus \
            -c ': > /tmp/api-token && exec promtool check config /etc/prometheus/prometheus.yml'
      - name: promtool test rules (cada alerta dispara e não dispara nos cenários certos)
        run: docker compose run --rm --no-deps --entrypoint promtool prometheus test rules /etc/prometheus/rules/slo.test.yml

  load:
    # Teste de carga e medição da carga inicial (spec 004, FR-010 a FR-019, SC-004 a SC-006; research R4
    # a R7). Gera o CSV duas vezes e compara os SHA-256, mede a carga direta e a carga por Kafka com o CSV
    # gerado e roda o k6 com os limites. O resumo vai ao $GITHUB_STEP_SUMMARY, e os relatórios, aos
    # artefatos. Nenhum segredo: o token do k6, quando usado, é o de demonstração.
    name: Teste de carga (k6) e carga inicial com o CSV gerado
    needs: dockerfile-lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build da imagem (sem publicação)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: awards:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Gerador, carga direta, carga por Kafka e k6
        run: .github/scripts/load-test.sh awards:ci
      - name: Relatórios do teste de carga
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relatorios-load
          path: target/load/
          if-no-files-found: warn

  compose:
    # Ambiente completo do modo Docker (spec 003, FR-015a, FR-028 a FR-035, SC-005 e SC-008; research
    # R20). O token do passo 8 é gerado no próprio job e nunca é impresso nem gravado. A credencial do
    # Grafana é a de demonstração do compose.yaml (constituição 1.6.0).
    name: Compose com PostgreSQL, Kafka, Prometheus e Grafana
    needs: dockerfile-lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Teste do compose (passos 0 a 8, 4b e 7b)
        run: .github/scripts/compose-test.sh

  deploy:
    # Publicação no Cloud Run (spec 005, FR-001 a FR-016; research R1 a R7 e R10; contracts/ci-deploy.md). Só
    # em push na main deste repositório, depois dos 10 checks obrigatórios. A imagem é a do job image, pelo
    # digest, sem rebuild. A identidade é federada (OIDC e Workload Identity Federation), sem chaves e sem
    # secrets: os valores abaixo são identificadores públicos, impressos pelo deploy/gcp/setup.sh. A revisão
    # nova sobe sem tráfego, é conferida pela URL própria e só então recebe o tráfego (clarificação de
    # 2026-11-26). A lista de needs acompanha os checks obrigatórios da main (regra 9 do check-workflows.sh).
    name: Publicação no Cloud Run e conferência da URL
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'andersonfelipediefenbach/outsera'
    needs: [workflow-policy, build, postgres, codeql, dependencies, dockerfile-lint, image, alert-rules, load, compose, frontend, web]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-cloud-run
      cancel-in-progress: false
    environment:
      name: cloud-run
      url: https://awards-2564509384.southamerica-east1.run.app
    env:
      GCP_PROJECT_ID: outsera-awards
      GCP_PROJECT_NUMBER: '2564509384'
      GCP_REGION: southamerica-east1
      GCP_WIF_PROVIDER: projects/2564509384/locations/global/workloadIdentityPools/github/providers/github-actions
      GCP_DEPLOY_SA: github-deployer@outsera-awards.iam.gserviceaccount.com
      GCP_RUNTIME_SA: awards-runtime@outsera-awards.iam.gserviceaccount.com
      GCP_REGISTRY: southamerica-east1-docker.pkg.dev/outsera-awards/awards
      GCP_SERVICE: awards
      SERVICE_URL: https://awards-2564509384.southamerica-east1.run.app
      IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
    steps:
      - name: Início da publicação
        run: echo "DEPLOY_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: awards-oci
          path: ${{ runner.temp }}/oci
      - name: O artefato é a imagem testada no job image
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::digest do job image ausente ou inválido: '$IMAGE_DIGEST'"
            exit 1
          fi
          layout="$RUNNER_TEMP/oci-layout"
          mkdir -p "$layout" && tar -xf "$RUNNER_TEMP/oci/awards-oci.tar" -C "$layout"
          found="$(jq -r '.manifests[0].digest' "$layout/index.json")"
          if [[ "$found" != "$IMAGE_DIGEST" ]]; then
            echo "::error::o artefato tem o manifesto $found, e o job image testou $IMAGE_DIGEST"
            exit 1
          fi
          echo "Artefato confere com a imagem testada: $IMAGE_DIGEST"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: '594.0.1'
      - name: Envio da imagem testada ao Artifact Registry, com o digest preservado
        run: |
          set -euo pipefail
          if ! command -v skopeo >/dev/null 2>&1; then
            echo "::error::o skopeo não está no runner (research R1)"
            exit 1
          fi
          # O token de acesso vai por stdin e nunca é impresso.
          gcloud auth print-access-token | skopeo login -u oauth2accesstoken --password-stdin "$GCP_REGION-docker.pkg.dev"
          ref="docker://$GCP_REGISTRY/awards:$GITHUB_SHA"
          skopeo copy --preserve-digests "oci-archive:$RUNNER_TEMP/oci/awards-oci.tar" "$ref"
          pushed="$(skopeo inspect --format '{{.Digest}}' "$ref")"
          if [[ "$pushed" != "$IMAGE_DIGEST" ]]; then
            echo "::error::o registro tem $pushed, e a imagem testada é $IMAGE_DIGEST"
            exit 1
          fi
          echo "Imagem no registro: $GCP_REGISTRY/awards@$pushed"
      - name: Implantação sem tráfego, com tag própria
        id: deploy
        run: |
          set -euo pipefail
          tag="c-${GITHUB_SHA::7}"
          # Só o modo padrão (FR-001): nenhum perfil, nenhum token. A única variável nova fecha as métricas na
          # URL pública e mantém os probes (FR-004a). 0 a 1 instância por revisão (FR-003).
          gcloud run deploy "$GCP_SERVICE" --quiet --project="$GCP_PROJECT_ID" --region="$GCP_REGION" \
            --image="$GCP_REGISTRY/awards@$IMAGE_DIGEST" \
            --service-account="$GCP_RUNTIME_SA" \
            --min-instances=0 --max-instances=1 --cpu=1 --memory=1Gi --cpu-boost --port=8080 \
            --set-env-vars=MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health \
            --startup-probe=httpGet.path=/actuator/health/readiness,httpGet.port=8080,periodSeconds=2,failureThreshold=60,timeoutSeconds=1 \
            --liveness-probe=httpGet.path=/actuator/health/liveness,httpGet.port=8080,periodSeconds=30,timeoutSeconds=3 \
            --no-traffic --tag="$tag"
          gcloud run services describe "$GCP_SERVICE" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format=json > "$RUNNER_TEMP/service.json"
          revision="$(jq -r '.status.latestCreatedRevisionName' "$RUNNER_TEMP/service.json")"
          tag_url="$(jq -r --arg t "$tag" '.status.traffic[]? | select(.tag == $t) | .url' "$RUNNER_TEMP/service.json")"
          if [[ -z "$revision" || -z "$tag_url" ]]; then
            echo "::error::revisão ($revision) ou URL da tag $tag ($tag_url) não encontradas"
            exit 1
          fi
          { echo "tag=$tag"; echo "revision=$revision"; echo "tag_url=$tag_url"; } >> "$GITHUB_OUTPUT"
          echo "Revisão $revision, sem tráfego, em $tag_url"
      - name: Conferência pela URL da revisão, antes do tráfego
        env:
          TAG_URL: ${{ steps.deploy.outputs.tag_url }}
        run: .github/scripts/verify-deployment.sh --expect-no-metrics "$TAG_URL"
      - name: Tráfego para a revisão conferida
        env:
          TAG: ${{ steps.deploy.outputs.tag }}
          REVISION: ${{ steps.deploy.outputs.revision }}
        run: |
          set -euo pipefail
          # As tags das revisões anteriores saem, para os endereços antigos não continuarem acessíveis.
          old_tags="$(jq -r --arg t "$TAG" '[.status.traffic[]? | select(.tag != null and .tag != $t) | .tag] | unique | join(",")' "$RUNNER_TEMP/service.json")"
          args=(--to-revisions="$REVISION=100")
          if [[ -n "$old_tags" ]]; then args+=(--remove-tags="$old_tags"); fi
          gcloud run services update-traffic "$GCP_SERVICE" --quiet --project="$GCP_PROJECT_ID" --region="$GCP_REGION" "${args[@]}"
      - name: Conferência pela URL pública
        run: .github/scripts/verify-deployment.sh --expect-no-metrics "$SERVICE_URL"
      - name: Resumo da publicação
        if: always()
        env:
          REVISION: ${{ steps.deploy.outputs.revision }}
          TAG_URL: ${{ steps.deploy.outputs.tag_url }}
        run: |
          {
            echo "### Publicação no Cloud Run"
            echo
            echo "| Item | Valor |"
            echo "| --- | --- |"
            echo "| URL pública | $SERVICE_URL |"
            echo "| Imagem | \`$GCP_REGISTRY/awards@$IMAGE_DIGEST\` |"
            echo "| Revisão | ${REVISION:-não criada} |"
            echo "| URL da revisão | ${TAG_URL:-não criada} |"
            echo "| Resultado do job | ${{ job.status }} |"
            echo "| Duração | $(( $(date +%s) - ${DEPLOY_START:-$(date +%s)} )) s |"
          } >> "$GITHUB_STEP_SUMMARY"
