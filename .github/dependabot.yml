# Atualizações automáticas (spec 002, FR-029; research R13). Os PRs passam pelo mesmo pipeline e pela
# mesma revisão de qualquer PR. Num PR que atualize uma action composta (por exemplo, a trivy-action),
# a revisão confere também as referências aninhadas da versão nova (research R10).
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      maven-minor-e-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  # Imagens do compose.yaml (spec 003, FR-034). Cada imagem é fixada por tag e digest.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

  # Front-end (spec 006, FR-019 e FR-025): dependências do npm e imagens base do frontend/Dockerfile.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "angular-eslint"
      npm-minor-e-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
