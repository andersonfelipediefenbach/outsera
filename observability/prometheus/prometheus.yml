# Coleta das métricas da aplicação no compose (spec 003, FR-031; research R18). Com a autenticação
# ligada, o token chega por /tmp/api-token, gravado na subida do container a partir de API_TOKEN, e nunca
# fica em arquivo versionado.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

# Alertas do SLO dos intervalos (spec 004, FR-004 a FR-006; docs/slo.md). Montado só leitura pelo compose.
rule_files:
  - /etc/prometheus/rules/slo.yml

scrape_configs:
  - job_name: app
    metrics_path: /actuator/prometheus
    authorization:
      type: Bearer
      credentials_file: /tmp/api-token
    static_configs:
      - targets: ["app:8080"]
